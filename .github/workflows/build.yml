# ============================================================
# Fikajy ERP - GitHub Actions - Windows + Linux
# ⭐ FIX: Mampiasa build:electron (build.cjs) - Obfuscation fotsiny (bytenode esorina)
# ============================================================

name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer EXE (NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Get application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "=========================================="
          Write-Host " APPLICATION VERSION"
          Write-Host "=========================================="
          Write-Host "Version: $version"
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.electron
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Verify Electron IPC files
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " VERIFY ELECTRON FILES"
          Write-Host "=========================================="
          if (!(Test-Path "electron/main.cjs")) { Write-Host "ERROR: electron/main.cjs missing"; exit 1 }
          if (!(Test-Path "electron/preload.cjs")) { Write-Host "ERROR: electron/preload.cjs missing"; exit 1 }
          if (!(Test-Path "electron/ipc/auth.cjs")) { Write-Host "ERROR: electron/ipc/auth.cjs missing"; exit 1 }
          if (!(Test-Path "electron/ipc/auth/handlers.cjs")) { Write-Host "ERROR: electron/ipc/auth/handlers.cjs missing"; exit 1 }
          Write-Host "OK: main.cjs"
          Write-Host "OK: preload.cjs"
          Write-Host "OK: auth.cjs"
          Write-Host "OK: auth/handlers.cjs"

      # ⭐ NEW: Mamorona ny private.pem avy amin'ny secret
      - name: Create private key from secret
        shell: pwsh
        run: |
          $privateKey = $env:PRIVATE_KEY
          if (-not $privateKey) { throw "PRIVATE_KEY secret is not set" }
          New-Item -ItemType Directory -Force -Path "admin-tools/keys" | Out-Null
          Set-Content -Path "admin-tools/keys/private.pem" -Value $privateKey -NoNewline
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: Build frontend
        run: npm run build

      - name: Build electron (obfuscation)   # ✅ Ovaina
        run: npm run build:electron
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: Verify production frontend
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " VERIFY DIST"
          Write-Host "=========================================="
          if (!(Test-Path "dist/index.html")) { Write-Host "ERROR: dist/index.html missing"; exit 1 }
          Write-Host "OK: dist/index.html"

      - name: Verify dist-electron keys
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " VERIFY DIST-ELECTRON KEYS"
          Write-Host "=========================================="
          if (!(Test-Path "dist-electron/keys/public.pem")) { Write-Host "ERROR: dist-electron/keys/public.pem missing"; exit 1 }
          if (!(Test-Path "dist-electron/keys/codes.db.enc")) { Write-Host "ERROR: dist-electron/keys/codes.db.enc missing"; exit 1 }
          if (Test-Path "dist-electron/keys/private.pem") { Write-Host "ERROR: private.pem should not be present"; exit 1 }
          Write-Host "OK: public.pem"
          Write-Host "OK: codes.db.enc"
          Write-Host "OK: private.pem absent"

      - name: Build Windows Installer EXE
        run: npx electron-builder --win --x64 --config electron-builder.yml --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Windows output
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " WINDOWS BUILD OUTPUT"
          Write-Host "=========================================="
          if (!(Test-Path "release")) { Write-Host "ERROR: release directory does not exist."; exit 1 }
          Get-ChildItem release -Recurse -File | Select-Object FullName, Length

      - name: Verify Windows EXE
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File -Filter "*.exe"
          if ($files.Count -eq 0) { Write-Host "ERROR: No Windows EXE found."; exit 1 }
          Write-Host ""
          Write-Host "Windows EXE Found:"
          $files | ForEach-Object { Write-Host $_.FullName }

      - name: Rename Windows EXE
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File -Filter "*.exe"
          foreach ($file in $files) {
            $newName = "Fikajy-$env:VERSION-win64-setup.exe"
            Write-Host "Renaming:"
            Write-Host "$($file.Name)"
            Write-Host "to"
            Write-Host "$newName"
            Rename-Item `
              -Path $file.FullName `
              -NewName $newName `
              -Force
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fikajy-win64-v${{ env.VERSION }}
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Get application version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "=========================================="
          echo " APPLICATION VERSION"
          echo "=========================================="
          echo "Version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.electron
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Verify Electron IPC files
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " VERIFY ELECTRON FILES"
          echo "=========================================="
          test -f electron/main.cjs || { echo "ERROR: electron/main.cjs missing"; exit 1; }
          test -f electron/preload.cjs || { echo "ERROR: electron/preload.cjs missing"; exit 1; }
          test -f electron/ipc/auth.cjs || { echo "ERROR: electron/ipc/auth.cjs missing"; exit 1; }
          test -f electron/ipc/auth/handlers.cjs || { echo "ERROR: electron/ipc/auth/handlers.cjs missing"; exit 1; }
          echo "OK: main.cjs"
          echo "OK: preload.cjs"
          echo "OK: auth.cjs"
          echo "OK: auth/handlers.cjs"

      # ⭐ NEW: Mamorona ny private.pem avy amin'ny secret
      - name: Create private key from secret
        shell: bash
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "PRIVATE_KEY secret is not set"
            exit 1
          fi
          mkdir -p admin-tools/keys
          echo "$PRIVATE_KEY" > admin-tools/keys/private.pem
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: Build frontend
        run: npm run build

      - name: Build electron (obfuscation)   # ✅ Ovaina
        run: npm run build:electron
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: Verify production frontend
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " VERIFY DIST"
          echo "=========================================="
          test -f dist/index.html || { echo "ERROR: dist/index.html missing"; exit 1; }
          echo "OK: dist/index.html"

      - name: Verify dist-electron keys
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " VERIFY DIST-ELECTRON KEYS"
          echo "=========================================="
          test -f dist-electron/keys/public.pem || { echo "ERROR: dist-electron/keys/public.pem missing"; exit 1; }
          test -f dist-electron/keys/codes.db.enc || { echo "ERROR: dist-electron/keys/codes.db.enc missing"; exit 1; }
          if [ -f dist-electron/keys/private.pem ]; then
            echo "ERROR: private.pem should not be present"
            exit 1
          fi
          echo "OK: public.pem"
          echo "OK: codes.db.enc"
          echo "OK: private.pem absent"

      - name: Build Linux DEB
        run: npx electron-builder --linux deb --x64 --config electron-builder.yml --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Linux output
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " LINUX BUILD OUTPUT"
          echo "=========================================="
          if [ ! -d "release" ]; then
            echo "ERROR: release directory does not exist."
            exit 1
          fi
          find release -maxdepth 1 -type f -print

      - name: Verify DEB
        shell: bash
        run: |
          COUNT=$(find release -maxdepth 1 -type f -name "*.deb" | wc -l)
          echo "DEB count: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Linux DEB package not found."
            exit 1
          fi

      - name: Rename Linux DEB
        shell: bash
        run: |
          for file in release/*.deb; do
            if [ -f "$file" ]; then
              mv "$file" "release/Fikajy-$VERSION-linux-x64.deb"
            fi
          done

      - name: Show final Linux artifacts
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " FINAL LINUX ARTIFACTS"
          echo "=========================================="
          ls -lah release/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fikajy-linux-v${{ env.VERSION }}
          path: release/*.deb
          if-no-files-found: error